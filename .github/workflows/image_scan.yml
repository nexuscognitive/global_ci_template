name: Scan Image with Trivy and Upload to Trino

on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Full image reference, e.g. myacr.azurecr.io/team/app:1.2.3 or nginx@sha256:...'
        required: true
        type: string
      timeout_minutes:
        description: 'Job timeout in minutes'
        required: false
        default: 60
        type: number
  workflow_call:
    inputs:
      image:
        description: 'Full image reference, e.g. myacr.azurecr.io/team/app:1.2.3 or nginx@sha256:...'
        required: true
        type: string
      timeout_minutes:
        description: 'Job timeout in minutes'
        required: false
        default: 60
        type: number
    secrets:
      # Only needed for private ACR images: the job logs in when the image's
      # registry matches ACR_REGISTRY, and pulls anonymously otherwise.
      ACR_REGISTRY:
        required: false
      ACR_USERNAME:
        required: false
      ACR_PASSWORD:
        required: false
      TRINO_HOST:
        required: true
      TRINO_USER:
        required: true
      TRINO_PASSWORD:
        required: true
      TRINO_CATALOG:
        required: true
      TRINO_SCHEMA:
        required: true
      TRINO_TABLE:
        required: true

jobs:
  scan:
    runs-on: ubuntu-latest
    # workflow_dispatch hands number inputs over as strings, which timeout-minutes
    # rejects; fromJSON turns either form back into a number.
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes || 60) }}

    steps:
      - name: Free disk space
        run: |
          echo "Before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo docker system prune -af || true
          sudo mkdir -p /mnt/trivy-tmp && sudo chmod 1777 /mnt/trivy-tmp
          echo "After cleanup:"
          df -h / /mnt || true

      # Split the reference into the same registry / name / tag columns that
      # build-push-acr.yml writes, so rows from both workflows line up in Trino.
      - name: Parse image reference
        id: ref
        env:
          IMAGE_INPUT: ${{ inputs.image }}
        run: |
          set -euo pipefail
          ref="$(echo "$IMAGE_INPUT" | xargs)"
          if [ -z "$ref" ] || [[ "$ref" =~ [[:space:]] ]]; then
            echo "::error::Invalid image reference: '$IMAGE_INPUT'"
            exit 1
          fi
          full="$ref"

          digest=""
          if [[ "$ref" == *@* ]]; then
            digest="${ref#*@}"
            ref="${ref%%@*}"
          fi

          # A ':' in the last path segment is a tag; one earlier is a registry port.
          tag=""
          last="${ref##*/}"
          if [[ "$last" == *:* ]]; then
            tag="${last##*:}"
            ref="${ref%:*}"
          fi

          # The first segment is a registry only if it looks like a host.
          first="${ref%%/*}"
          if [[ "$ref" == */* ]] && { [[ "$first" == *.* ]] || [[ "$first" == *:* ]] || [ "$first" = "localhost" ]; }; then
            registry="$first"
            name="${ref#*/}"
          else
            registry="docker.io"
            name="$ref"
          fi

          if [ -z "$tag" ] && [ -z "$digest" ]; then
            tag="latest"
            full="${full}:latest"
          fi

          echo "Image:    $full"
          echo "Registry: $registry"
          echo "Name:     $name"
          echo "Tag:      ${tag:-<none>}"
          echo "Digest:   ${digest:-<none>}"
          {
            echo "IMAGE=$full"
            echo "REGISTRY=$registry"
            echo "NAME=$name"
            echo "TAG=$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Login to Azure Container Registry
        id: login
        env:
          IMAGE_REGISTRY: ${{ steps.ref.outputs.REGISTRY }}
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          if [ -n "$ACR_REGISTRY" ] && [ "$IMAGE_REGISTRY" = "$ACR_REGISTRY" ]; then
            if [ -z "$ACR_USERNAME" ] || [ -z "$ACR_PASSWORD" ]; then
              echo "::error::Image is in $ACR_REGISTRY but ACR_USERNAME / ACR_PASSWORD are not set"
              exit 1
            fi
            echo "$ACR_PASSWORD" | docker login "$ACR_REGISTRY" --username "$ACR_USERNAME" --password-stdin
            echo "LOGGED_IN=true" >> "$GITHUB_OUTPUT"
          else
            echo "Registry $IMAGE_REGISTRY is not the configured ACR; pulling anonymously"
          fi

      - name: Pull image
        env:
          IMAGE: ${{ steps.ref.outputs.IMAGE }}
        run: |
          echo "⬇️  Pulling: $IMAGE"
          docker pull "$IMAGE"
          docker image inspect "$IMAGE" --format '{{.Size}}' | numfmt --to=iec

      # Trivy exports the whole uncompressed image before analysing it, so give it
      # its temp space on /mnt (the runner's big volume) -- see build-push-acr.yml.
      - name: Trivy vulnerability scan
        env:
          IMAGE: ${{ steps.ref.outputs.IMAGE }}
        run: |
          echo "🔍 Running Trivy scan on: $IMAGE"
          mkdir -p trivy-out
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy":/root/.cache/ \
            -v /mnt/trivy-tmp:/tmp \
            -v "$PWD/trivy-out":/out \
            aquasec/trivy:0.76.2 image "$IMAGE" \
            --timeout 20m \
            --exit-code 0 \
            --severity LOW,MEDIUM,HIGH,CRITICAL \
            --format json \
            --output /out/trivy.json
          echo "📄 Rendering table view for the log:"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy":/root/.cache/ \
            -v /mnt/trivy-tmp:/tmp \
            aquasec/trivy:0.76.2 image "$IMAGE" \
            --timeout 20m \
            --exit-code 0 \
            --severity HIGH,CRITICAL \
            --format table || true

      - name: Upload scan report artifact
        if: always() && hashFiles('trivy-out/trivy.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-out/trivy.json

      # Unlike build-push-acr.yml, uploading is the point of this workflow, so a
      # missing secret or a Trino error fails the job instead of being skipped.
      - name: Upload Trivy results to Trino
        env:
          TRINO_HOST: ${{ secrets.TRINO_HOST }}
          TRINO_USER: ${{ secrets.TRINO_USER }}
          TRINO_PASSWORD: ${{ secrets.TRINO_PASSWORD }}
          TRINO_CATALOG: ${{ secrets.TRINO_CATALOG }}
          TRINO_SCHEMA: ${{ secrets.TRINO_SCHEMA }}
          TRINO_TABLE: ${{ secrets.TRINO_TABLE }}
          IMAGE_FULL: ${{ steps.ref.outputs.IMAGE }}
          IMAGE_REGISTRY: ${{ steps.ref.outputs.REGISTRY }}
          IMAGE_NAME: ${{ steps.ref.outputs.NAME }}
          IMAGE_TAG: ${{ steps.ref.outputs.TAG }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ ! -s trivy-out/trivy.json ]; then
            echo "::error::trivy-out/trivy.json missing or empty"
            exit 1
          fi
          missing=0
          for v in TRINO_HOST TRINO_USER TRINO_PASSWORD TRINO_CATALOG TRINO_SCHEMA TRINO_TABLE; do
            if [ -z "${!v:-}" ]; then
              echo "::error::$v is not set"
              missing=1
            fi
          done
          [ "$missing" = "1" ] && exit 1
          python3 -m pip install --quiet 'trino==0.328.0'
          python3 - <<'PY'
          import datetime, json, os
          from trino.dbapi import connect
          from trino.auth import BasicAuthentication

          host = os.environ["TRINO_HOST"]
          if ":" in host:
              h, port_s = host.rsplit(":", 1)
              port = int(port_s)
          else:
              h, port = host, 443

          user = os.environ["TRINO_USER"]
          password = os.environ["TRINO_PASSWORD"]
          catalog = os.environ["TRINO_CATALOG"]
          schema = os.environ["TRINO_SCHEMA"]
          table = os.environ["TRINO_TABLE"]

          image_full = os.environ["IMAGE_FULL"]
          registry = os.environ["IMAGE_REGISTRY"]
          image_name = os.environ["IMAGE_NAME"]
          image_tag = os.environ["IMAGE_TAG"]
          gh_repo = os.environ.get("GH_REPOSITORY", "")
          gh_run = os.environ.get("GH_RUN_ID", "")
          gh_sha = os.environ.get("GH_SHA", "")

          with open("trivy-out/trivy.json") as f:
              data = json.load(f)

          metadata = data.get("Metadata") or {}
          os_info = metadata.get("OS") or {}
          repo_digests = metadata.get("RepoDigests") or []
          image_digest = ""
          if repo_digests and "@" in repo_digests[0]:
              image_digest = repo_digests[0].split("@", 1)[1]

          def pick_cvss(cvss_data):
              if not cvss_data:
                  return None
              for vendor in ("nvd", "redhat", "ghsa"):
                  v = cvss_data.get(vendor)
                  if v:
                      score = v.get("V3Score") or v.get("V2Score")
                      if score is not None:
                          return float(score)
              first = next(iter(cvss_data.values()), None) or {}
              score = first.get("V3Score") or first.get("V2Score")
              return float(score) if score is not None else None

          scan_time = datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0, tzinfo=None)
          rows = []
          for result in (data.get("Results") or []):
              target = result.get("Target", "")
              cls = result.get("Class", "")
              pkg_type = result.get("Type", "")
              for v in (result.get("Vulnerabilities") or []):
                  fixed = v.get("FixedVersion") or ""
                  rows.append((
                      scan_time,
                      registry,
                      image_name,
                      image_tag,
                      image_full,
                      image_digest,
                      os_info.get("Family", ""),
                      os_info.get("Name", ""),
                      target,
                      cls,
                      pkg_type,
                      v.get("VulnerabilityID", ""),
                      v.get("PkgName", ""),
                      v.get("InstalledVersion", ""),
                      fixed,
                      bool(fixed),
                      v.get("Severity", ""),
                      (v.get("Title") or "")[:2000],
                      v.get("PrimaryURL", ""),
                      pick_cvss(v.get("CVSS")),
                      gh_repo,
                      gh_run,
                      gh_sha,
                  ))

          print(f"Connecting to Trino at {h}:{port} as {user}")
          conn = connect(
              host=h,
              port=port,
              http_scheme="https",
              user=user,
              auth=BasicAuthentication(user, password),
              catalog=catalog,
              schema=schema,
          )
          cur = conn.cursor()

          fq = f'"{catalog}"."{schema}"."{table}"'
          cur.execute(f"""
          CREATE TABLE IF NOT EXISTS {fq} (
            scan_time TIMESTAMP,
            registry VARCHAR,
            image_name VARCHAR,
            image_tag VARCHAR,
            image_full VARCHAR,
            image_digest VARCHAR,
            os_family VARCHAR,
            os_name VARCHAR,
            target VARCHAR,
            class VARCHAR,
            pkg_type VARCHAR,
            vulnerability_id VARCHAR,
            pkg_name VARCHAR,
            installed_version VARCHAR,
            fixed_version VARCHAR,
            fix_available BOOLEAN,
            severity VARCHAR,
            title VARCHAR,
            primary_url VARCHAR,
            cvss_score DOUBLE,
            github_repository VARCHAR,
            github_run_id VARCHAR,
            github_sha VARCHAR
          )
          """)
          cur.fetchall()

          if not rows:
              print("No vulnerabilities found; recording a single scan-marker row")
              rows = [(
                  scan_time, registry, image_name, image_tag, image_full, image_digest,
                  os_info.get("Family", ""), os_info.get("Name", ""), "", "", "",
                  "", "", "", "", False, "NONE", "", "", None,
                  gh_repo, gh_run, gh_sha,
              )]

          def lit(v):
              if v is None:
                  return "NULL"
              if isinstance(v, bool):
                  return "TRUE" if v else "FALSE"
              if isinstance(v, (int, float)):
                  return repr(v)
              if isinstance(v, datetime.datetime):
                  return f"TIMESTAMP '{v.isoformat(sep=' ', timespec='seconds')}'"
              s = str(v).replace("'", "''")
              return f"'{s}'"

          cols = (
              "scan_time, registry, image_name, image_tag, image_full, image_digest, "
              "os_family, os_name, target, class, pkg_type, vulnerability_id, pkg_name, "
              "installed_version, fixed_version, fix_available, severity, title, "
              "primary_url, cvss_score, github_repository, github_run_id, github_sha"
          )

          BATCH = 200
          total = 0
          for i in range(0, len(rows), BATCH):
              chunk = rows[i:i + BATCH]
              values = ", ".join("(" + ", ".join(lit(c) for c in r) + ")" for r in chunk)
              cur.execute(f"INSERT INTO {fq} ({cols}) VALUES {values}")
              cur.fetchall()
              total += len(chunk)
          print(f"✅ Inserted {total} rows into {catalog}.{schema}.{table}")
          PY

      - name: Logout
        if: always() && steps.login.outputs.LOGGED_IN == 'true'
        run: docker logout "${{ steps.ref.outputs.REGISTRY }}"
