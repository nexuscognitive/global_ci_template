name: Build & Push Image with trivy scan on Tag (ACR)

# Two kinds of build come out of this workflow, and they are never confused:
#
#   release  - triggered by a strict semver git tag vX.Y.Z. Container tag <X.Y.Z>[-<variant>]
#              (leading `v` stripped: v3.4.0 -> 3.4.0). The only path that produces a tag
#              updatecli or a tenant pin will ever consume.
#   preview  - anything else a caller chooses to allow through: workflow_dispatch, a branch
#              push, a pull_request. Container tag sha-<short7>[-<variant>], plus pr-<n> when
#              the run is for a PR. Preview tags can never parse as semver, never create a
#              GitHub Release, never move `latest` (this workflow does not touch `latest` at
#              all), and never create a git tag. They exist so nobody needs to push a tag to
#              get an image built.
#
# The `resolve-version` job below is the single place that decides which kind a run is and
# what its container tag is. See design decisions 0003 (tag scheme) and 0015 (immutability).

on:
  workflow_call:
    inputs:
      images:
        description: >-
          JSON array of images to build. Each entry takes "name", "dockerfile" and
          "context", an optional "build_args" list of "KEY=VALUE" strings, and an
          optional "variant". When "variant" is set the container tag becomes
          <version>-<variant> (e.g. 3.4.0-spark3); without it the tag is just <version>.
          The variant never appears in the git tag or the release -- a repo has one
          version, its containers may have several tags.
        required: true
        type: string
      ref:
        description: >-
          Git ref (branch, tag or SHA) to build a preview image from. Only meaningful for
          non-release runs; a caller's workflow_dispatch should forward its own `ref` input
          here. Empty means "the ref that triggered the run". Passing a vX.Y.Z tag here does
          NOT make a release build -- releases come only from the tag push event itself.
        required: false
        default: ''
        type: string
      lfs:
        description: 'Enable Git LFS checkout'
        required: false
        default: false
        type: boolean
      timeout_minutes:
        description: >-
          Per-image job timeout. Raise it for images whose squash step runs long --
          the squash rewrites the whole image, so its cost tracks total image size,
          and a repo can cross the 60-minute default without its build changing much.
        required: false
        default: 60
        type: number
    outputs:
      release:
        description: '"true" when the run was triggered by a vX.Y.Z tag and built release images.'
        value: ${{ jobs.resolve-version.outputs.release }}
      version:
        description: 'Semver version with the leading v stripped (3.4.0). Empty for non-release builds.'
        value: ${{ jobs.resolve-version.outputs.version }}
      container_tag:
        description: >-
          Base container tag every image in this run was tagged with, before any per-image
          variant suffix: <X.Y.Z> for releases, sha-<short7> for previews. Callers that
          build extra images outside the template must use this rather than re-deriving a
          tag from GITHUB_REF.
        value: ${{ jobs.resolve-version.outputs.container_tag }}
      extra_tags:
        description: 'Space-separated additional base tags pushed for preview builds (pr-<n>). Empty for releases.'
        value: ${{ jobs.resolve-version.outputs.extra_tags }}
    secrets:
      ACR_REGISTRY:
        required: true
      ACR_USERNAME:
        required: true
      ACR_PASSWORD:
        required: true
      NPM_TOKEN:
        required: false
      TRINO_HOST:
        required: false
      TRINO_USER:
        required: false
      TRINO_PASSWORD:
        required: false
      TRINO_CATALOG:
        required: false
      TRINO_SCHEMA:
        required: false
      TRINO_TABLE:
        required: false
      GH_PAT:
        required: false

  # Direct dispatch of the template itself. Runs with this repository's secrets, so it is
  # mainly for exercising the workflow; day-to-day preview builds should come from a
  # `workflow_dispatch` trigger in the calling repo that forwards `ref` (see the caller
  # example in the resolve-version job comments).
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (branch, tag or SHA) to build a preview image from'
        required: false
        default: ''
        type: string
      images:
        description: 'JSON array of images to build (same shape as the workflow_call input)'
        required: true
        type: string
      lfs:
        description: 'Enable Git LFS checkout'
        required: false
        default: false
        type: boolean
      timeout_minutes:
        description: 'Per-image job timeout in minutes'
        required: false
        default: 60
        type: number

jobs:
  # Runs once, before any image job, and is the only thing allowed to decide what the
  # container tag is. The build matrix consumes its outputs; nothing downstream reads
  # GITHUB_REF directly.
  #
  # Caller example -- release on tag, preview on demand:
  #
  #   on:
  #     push:
  #       tags: ['v[0-9]*.[0-9]*.[0-9]*']   # glob; the real check is the regex guard below
  #     workflow_dispatch:
  #       inputs:
  #         ref: { description: 'Branch, tag or SHA to build a preview from', required: false, default: '' }
  #   jobs:
  #     release:
  #       uses: nexuscognitive/global_ci_template/.github/workflows/build-push-acr.yml@main
  #       with:
  #         ref: ${{ inputs.ref }}
  #         images: '[{"name": "airflow-spark3", "dockerfile": "docker/Dockerfile.spark3", "context": "docker", "variant": "spark3"}]'
  #       secrets: ...
  #
  # `gh workflow run build.yml --ref my-branch` then pushes airflow-spark3:sha-<short7>-spark3
  # and creates no git tag. Add `pull_request:` and/or `push: branches:` triggers to get
  # previews for PRs or branches too.
  resolve-version:
    name: Resolve version from ref
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.ref.outputs.release }}
      version: ${{ steps.ref.outputs.version }}
      container_tag: ${{ steps.ref.outputs.container_tag || steps.preview.outputs.container_tag }}
      extra_tags: ${{ steps.preview.outputs.extra_tags }}
      # Ref the build jobs must check out. Empty = actions/checkout default for the event.
      checkout_ref: ${{ steps.preview.outputs.checkout_ref }}
    steps:
      # Why a regex guard here and not just `on: push: tags: ['v[0-9]+.[0-9]+.[0-9]+']` in
      # the caller: GitHub's tag filters are globs, not regexes. In a glob `+` is a literal
      # plus sign and `.` matches a literal dot only, so that pattern matches the tag
      # `v1+.2+.3+` and not `v1.2.3`. Callers can (and should) narrow their trigger with a
      # glob such as `v[0-9]*.[0-9]*.[0-9]*`, but a glob cannot express "digits only, exactly
      # three groups, nothing after". This step can, and because it lives in the reusable
      # workflow every consumer inherits it in one change.
      #
      # Strict on purpose: no pre-release or build-metadata suffix. `v1.2.3-rc1` and
      # `v0.0.1-test` are rejected, because semver sorts a pre-release *below* its release
      # and updatecli's `versionfilter: semver` would treat them as older than what tenants
      # already run. Non-release builds get their own tag scheme (sha-<short>, pr-<n>) and
      # are the only other thing allowed past this guard.
      - name: Guard - release builds only from vX.Y.Z tags
        id: ref
        env:
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # Canonical release-tag pattern. Group 1 is the version without the `v`.
          SEMVER_TAG_RE='^refs/tags/v([0-9]+\.[0-9]+\.[0-9]+)$'

          if [[ "$REF" =~ $SEMVER_TAG_RE ]]; then
            VERSION="${BASH_REMATCH[1]}"
            {
              echo "release=true"
              echo "version=$VERSION"
              echo "container_tag=$VERSION"
            } >> "$GITHUB_OUTPUT"
            echo "::notice title=Release build::$REF -> container tag $VERSION"
            exit 0
          fi

          echo "release=false" >> "$GITHUB_OUTPUT"

          # A tag that is not vX.Y.Z is refused outright. It is neither a release nor a
          # preview: legacy and experimental tags must produce no image at all, otherwise
          # people keep pushing tags to get builds and the version sequence fills with noise.
          if [[ "$REF" == refs/tags/* ]]; then
            echo "::error title=Refusing to build::Tag '${REF#refs/tags/}' is not a release tag." \
                 "Release images are built only from tags matching vX.Y.Z (e.g. v3.4.0)." \
                 "Tags are cut by release-please; do not push tags by hand." \
                 "For a test image run the workflow manually against a branch (gh workflow run ... --ref <branch>)."
            exit 1
          fi

          # Everything else (workflow_dispatch, branch push, pull_request) is explicitly a
          # preview build. The caller opted in by adding the trigger.
          echo "::notice title=Preview build::Event '$EVENT' on '$REF' is not a release; images will be tagged sha-<short7>."

      # Only needed to turn an explicit `ref` input into a SHA. The event's own SHA is
      # already in the context, so no checkout is done for the common case.
      - name: Check out requested ref
        if: steps.ref.outputs.release == 'false' && inputs.ref != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Compute preview tags
        id: preview
        if: steps.ref.outputs.release == 'false'
        env:
          INPUT_REF: ${{ inputs.ref }}
          EVENT: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # Pick the commit the image is built from, most specific source first:
          #   explicit ref input > PR head (github.sha is the synthetic merge commit) > event sha
          if [ -n "$INPUT_REF" ]; then
            SHA="$(git rev-parse HEAD)"
            CHECKOUT_REF="$INPUT_REF"
          elif [ -n "$PR_HEAD_SHA" ]; then
            SHA="$PR_HEAD_SHA"
            CHECKOUT_REF="$PR_HEAD_SHA"
          else
            SHA="$EVENT_SHA"
            CHECKOUT_REF=""
          fi
          SHORT="${SHA:0:7}"

          # Preview scheme: sha-<short7>, plus pr-<n> for pull requests. Neither can ever
          # match the release regex, so nothing that filters on semver will pick them up.
          CONTAINER_TAG="sha-${SHORT}"
          EXTRA_TAGS=""
          if [ -n "$PR_NUMBER" ]; then
            EXTRA_TAGS="pr-${PR_NUMBER}"
          fi

          {
            echo "container_tag=$CONTAINER_TAG"
            echo "extra_tags=$EXTRA_TAGS"
            echo "checkout_ref=$CHECKOUT_REF"
          } >> "$GITHUB_OUTPUT"
          echo "Preview build of $SHA -> $CONTAINER_TAG ${EXTRA_TAGS:+(+ $EXTRA_TAGS)}"

  build-and-push:
    needs: resolve-version
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}

    strategy:
      matrix:
        image: ${{ fromJson(inputs.images) }}

    steps:
      - name: Free disk space
        run: |
          echo "Before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo docker system prune -af || true
          echo "After cleanup:"
          df -h

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-version.outputs.checkout_ref }}
          lfs: ${{ inputs.lfs }}

      # The one place the per-image tag is assembled: <container_tag>[-<variant>].
      # Every later step refers to steps.image.outputs.TAG and never to GITHUB_REF.
      - name: Compute container tag
        id: image
        env:
          BASE_TAG: ${{ needs.resolve-version.outputs.container_tag }}
          VARIANT: ${{ matrix.image.variant }}
        run: |
          set -euo pipefail
          [ -n "$BASE_TAG" ] || { echo "::error::resolve-version produced no container_tag"; exit 1; }
          TAG="${BASE_TAG}${VARIANT:+-$VARIANT}"
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
          echo "Container tag for ${{ matrix.image.name }}: $TAG"

      - name: Debug secrets presence (safe)
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          for var in ACR_REGISTRY ACR_USERNAME ACR_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "❌ $var is EMPTY"
            else
              echo "✅ $var is SET"
            fi
          done

      - name: Login to Azure Container Registry
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | \
          docker login ${{ secrets.ACR_REGISTRY }} \
            --username ${{ secrets.ACR_USERNAME }} \
            --password-stdin

      - name: Build image
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          # Optional per-image "KEY=VALUE" list. For images that do not set it this is
          # the literal string "null", and no --build-arg is added.
          BUILD_ARGS_JSON: ${{ toJson(matrix.image.build_args) }}
        run: |
          IMAGE=${{ secrets.ACR_REGISTRY }}/${{ matrix.image.name }}:${{ steps.image.outputs.TAG }}
          echo "Building image: $IMAGE"

          BUILD_ARGS=()
          if [ "$BUILD_ARGS_JSON" != "null" ]; then
            while IFS= read -r kv; do
              [ -n "$kv" ] || continue
              echo "  --build-arg $kv"
              BUILD_ARGS+=(--build-arg "$kv")
            done < <(jq -r '.[]' <<<"$BUILD_ARGS_JSON")
          fi

          # ${BUILD_ARGS[@]+...} keeps an empty array safe if the shell runs with `set -u`.
          docker build \
            ${BUILD_ARGS[@]+"${BUILD_ARGS[@]}"} \
            --secret id=GH_PAT,env=GH_PAT \
            -f ${{ matrix.image.dockerfile }} \
            -t $IMAGE \
            ${{ matrix.image.context }}

      - name: Install docker-squash
        run: pip install docker-squash

      - name: Squash image
        run: |
          IMAGE=${{ secrets.ACR_REGISTRY }}/${{ matrix.image.name }}:${{ steps.image.outputs.TAG }}
          echo "Size before squash:"
          docker image inspect "$IMAGE" --format '{{.Size}}' | numfmt --to=iec
          docker-squash -t "$IMAGE" "$IMAGE"
          echo "Size after squash:"
          docker image inspect "$IMAGE" --format '{{.Size}}' | numfmt --to=iec

      - name: Push image
        env:
          # Preview-only aliases (pr-<n>). Empty for release builds, which get exactly one
          # tag per variant. `latest` is deliberately never written by this workflow.
          EXTRA_TAGS: ${{ needs.resolve-version.outputs.extra_tags }}
          VARIANT: ${{ matrix.image.variant }}
        run: |
          set -euo pipefail
          IMAGE=${{ secrets.ACR_REGISTRY }}/${{ matrix.image.name }}:${{ steps.image.outputs.TAG }}
          echo "Pushing image: $IMAGE"
          docker push "$IMAGE"
          for base in $EXTRA_TAGS; do
            ALIAS=${{ secrets.ACR_REGISTRY }}/${{ matrix.image.name }}:${base}${VARIANT:+-$VARIANT}
            echo "Pushing alias: $ALIAS"
            docker tag "$IMAGE" "$ALIAS"
            docker push "$ALIAS"
          done

      # Trivy exports the whole uncompressed image before analysing it. Images that carry
      # a Spark distribution are large enough that this filled the runner's root disk and
      # failed the scan -- which also skips the severity gate below, so a scan that cannot
      # run silently stops gating anything. Reclaim the build cache (the tagged image is
      # kept) and give Trivy its temp space on /mnt, which is the runner's big volume.
      - name: Reclaim disk before scan
        run: |
          echo "Before:"; df -h / /mnt || true
          docker builder prune -af || true
          docker image prune -f || true
          sudo mkdir -p /mnt/trivy-tmp && sudo chmod 1777 /mnt/trivy-tmp
          echo "After:"; df -h / /mnt || true

      - name: Trivy vulnerability scan
        run: |
          IMAGE=${{ secrets.ACR_REGISTRY }}/${{ matrix.image.name }}:${{ steps.image.outputs.TAG }}
          echo "🔍 Running Trivy scan on: $IMAGE"
          mkdir -p trivy-out
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v $HOME/.cache/trivy:/root/.cache/ \
            -v /mnt/trivy-tmp:/tmp \
            -v "$PWD/trivy-out":/out \
            aquasec/trivy:0.69.1 image "$IMAGE" \
            --timeout 20m \
            --exit-code 0 \
            --severity LOW,MEDIUM,HIGH,CRITICAL \
            --format json \
            --output /out/trivy.json
          echo "📄 Rendering table view for the log:"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v $HOME/.cache/trivy:/root/.cache/ \
            -v /mnt/trivy-tmp:/tmp \
            aquasec/trivy:0.69.1 image "$IMAGE" \
            --timeout 20m \
            --exit-code 0 \
            --severity HIGH,CRITICAL \
            --format table || true

      - name: Upload Trivy results to Trino
        if: always()
        continue-on-error: true
        env:
          TRINO_HOST: ${{ secrets.TRINO_HOST }}
          TRINO_USER: ${{ secrets.TRINO_USER }}
          TRINO_PASSWORD: ${{ secrets.TRINO_PASSWORD }}
          TRINO_CATALOG: ${{ secrets.TRINO_CATALOG }}
          TRINO_SCHEMA: ${{ secrets.TRINO_SCHEMA }}
          TRINO_TABLE: ${{ secrets.TRINO_TABLE }}
          IMAGE_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          IMAGE_NAME: ${{ matrix.image.name }}
          IMAGE_TAG: ${{ steps.image.outputs.TAG }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ ! -s trivy-out/trivy.json ]; then
            echo "::warning::trivy-out/trivy.json missing or empty; skipping Trino upload"
            exit 0
          fi
          missing=0
          for v in TRINO_HOST TRINO_USER TRINO_PASSWORD TRINO_CATALOG TRINO_SCHEMA TRINO_TABLE; do
            if [ -z "${!v:-}" ]; then
              echo "::warning::$v is not set; skipping Trino upload"
              missing=1
            fi
          done
          [ "$missing" = "1" ] && exit 0
          python3 -m pip install --quiet 'trino==0.328.0'
          python3 - <<'PY'
          import datetime, json, os, sys
          from trino.dbapi import connect
          from trino.auth import BasicAuthentication

          host = os.environ["TRINO_HOST"]
          if ":" in host:
              h, port_s = host.rsplit(":", 1)
              port = int(port_s)
          else:
              h, port = host, 443

          user = os.environ["TRINO_USER"]
          password = os.environ["TRINO_PASSWORD"]
          catalog = os.environ["TRINO_CATALOG"]
          schema = os.environ["TRINO_SCHEMA"]
          table = os.environ["TRINO_TABLE"]

          registry = os.environ["IMAGE_REGISTRY"]
          image_name = os.environ["IMAGE_NAME"]
          image_tag = os.environ["IMAGE_TAG"]
          image_full = f"{registry}/{image_name}:{image_tag}"
          gh_repo = os.environ.get("GH_REPOSITORY", "")
          gh_run = os.environ.get("GH_RUN_ID", "")
          gh_sha = os.environ.get("GH_SHA", "")

          with open("trivy-out/trivy.json") as f:
              data = json.load(f)

          metadata = data.get("Metadata") or {}
          os_info = metadata.get("OS") or {}
          repo_digests = metadata.get("RepoDigests") or []
          image_digest = ""
          if repo_digests and "@" in repo_digests[0]:
              image_digest = repo_digests[0].split("@", 1)[1]

          def pick_cvss(cvss_data):
              if not cvss_data:
                  return None
              for vendor in ("nvd", "redhat", "ghsa"):
                  v = cvss_data.get(vendor)
                  if v:
                      score = v.get("V3Score") or v.get("V2Score")
                      if score is not None:
                          return float(score)
              first = next(iter(cvss_data.values()), None) or {}
              score = first.get("V3Score") or first.get("V2Score")
              return float(score) if score is not None else None

          scan_time = datetime.datetime.utcnow().replace(microsecond=0)
          rows = []
          for result in (data.get("Results") or []):
              target = result.get("Target", "")
              cls = result.get("Class", "")
              pkg_type = result.get("Type", "")
              for v in (result.get("Vulnerabilities") or []):
                  fixed = v.get("FixedVersion") or ""
                  rows.append((
                      scan_time,
                      registry,
                      image_name,
                      image_tag,
                      image_full,
                      image_digest,
                      os_info.get("Family", ""),
                      os_info.get("Name", ""),
                      target,
                      cls,
                      pkg_type,
                      v.get("VulnerabilityID", ""),
                      v.get("PkgName", ""),
                      v.get("InstalledVersion", ""),
                      fixed,
                      bool(fixed),
                      v.get("Severity", ""),
                      (v.get("Title") or "")[:2000],
                      v.get("PrimaryURL", ""),
                      pick_cvss(v.get("CVSS")),
                      gh_repo,
                      gh_run,
                      gh_sha,
                  ))

          print(f"Connecting to Trino at {h}:{port} as {user}")
          conn = connect(
              host=h,
              port=port,
              http_scheme="https",
              user=user,
              auth=BasicAuthentication(user, password),
              catalog=catalog,
              schema=schema,
          )
          cur = conn.cursor()

          fq = f'"{catalog}"."{schema}"."{table}"'
          cur.execute(f"""
          CREATE TABLE IF NOT EXISTS {fq} (
            scan_time TIMESTAMP,
            registry VARCHAR,
            image_name VARCHAR,
            image_tag VARCHAR,
            image_full VARCHAR,
            image_digest VARCHAR,
            os_family VARCHAR,
            os_name VARCHAR,
            target VARCHAR,
            class VARCHAR,
            pkg_type VARCHAR,
            vulnerability_id VARCHAR,
            pkg_name VARCHAR,
            installed_version VARCHAR,
            fixed_version VARCHAR,
            fix_available BOOLEAN,
            severity VARCHAR,
            title VARCHAR,
            primary_url VARCHAR,
            cvss_score DOUBLE,
            github_repository VARCHAR,
            github_run_id VARCHAR,
            github_sha VARCHAR
          )
          """)
          cur.fetchall()

          if not rows:
              print("No vulnerabilities found; recording a single scan-marker row")
              rows = [(
                  scan_time, registry, image_name, image_tag, image_full, image_digest,
                  os_info.get("Family", ""), os_info.get("Name", ""), "", "", "",
                  "", "", "", "", False, "NONE", "", "", None,
                  gh_repo, gh_run, gh_sha,
              )]

          def lit(v):
              if v is None:
                  return "NULL"
              if isinstance(v, bool):
                  return "TRUE" if v else "FALSE"
              if isinstance(v, (int, float)):
                  return repr(v)
              if isinstance(v, datetime.datetime):
                  return f"TIMESTAMP '{v.isoformat(sep=' ', timespec='seconds')}'"
              s = str(v).replace("'", "''")
              return f"'{s}'"

          cols = (
              "scan_time, registry, image_name, image_tag, image_full, image_digest, "
              "os_family, os_name, target, class, pkg_type, vulnerability_id, pkg_name, "
              "installed_version, fixed_version, fix_available, severity, title, "
              "primary_url, cvss_score, github_repository, github_run_id, github_sha"
          )

          BATCH = 200
          total = 0
          for i in range(0, len(rows), BATCH):
              chunk = rows[i:i + BATCH]
              values = ", ".join("(" + ", ".join(lit(c) for c in r) + ")" for r in chunk)
              cur.execute(f"INSERT INTO {fq} ({cols}) VALUES {values}")
              cur.fetchall()
              total += len(chunk)
          print(f"✅ Inserted {total} rows into {catalog}.{schema}.{table}")
          PY

      - name: Enforce severity gate (HIGH/CRITICAL)
        if: always() && hashFiles('trivy-out/trivy.json') != ''
        run: |
          python3 - <<'PY'
          import json, sys
          with open("trivy-out/trivy.json") as f:
              data = json.load(f)
          bad = []
          for r in (data.get("Results") or []):
              for v in (r.get("Vulnerabilities") or []):
                  if v.get("Severity") in ("HIGH", "CRITICAL"):
                      bad.append((v.get("Severity"), v.get("VulnerabilityID"), v.get("PkgName")))
          if bad:
              print(f"❌ Found {len(bad)} HIGH/CRITICAL vulnerabilities")
              for sev, vid, pkg in bad[:50]:
                  print(f"  {sev}: {vid} in {pkg}")
              sys.exit(0)
          print("✅ No HIGH/CRITICAL vulnerabilities")
          PY

      - name: Logout
        if: always()
        run: docker logout ${{ secrets.ACR_REGISTRY }}
